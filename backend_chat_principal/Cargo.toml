[package]
name = "noyau_spatial_yrion"
version = "4.0.0"
edition = "2021"

[dependencies]
# ⚡ Mise à niveau de Tokio pour une compatibilité parfaite avec Axum 0.7
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
lazy_static = "1.4.0"

# 🛰️ AJOUTS INDISPENSABLES POUR LE SYSTÈME QUANTIQUE D'YRION
uuid = { version = "1.7", features = ["v4", "serde"] } # Pour générer les IDs de notifs uniques