[package]
name = "backend_token"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# sqlx pour la connexion asynchrone à ta base SQL (Exemple avec PostgreSQL, change "postgres" par "mysql" si besoin)
sqlx = { version = "0.7", features = [ "runtime-tokio", "postgres", "macros", "chrono" ] }
tokio = { version = "1.35", features = ["full"] }